<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#4A90E2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="영어 단어 테스트">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon.svg">
    <title>영어 단어 테스트</title>
    <link rel="stylesheet" href="styles-v6.css">
</head>
<body>

<div class="container">
    <h1>영어 단어 테스트 📝</h1>

    <div class="tabs" role="tablist" aria-label="학습 모드">
        <button id="word-study-tab" class="tab active" role="tab" aria-selected="true">단어공부</button>
    </div>

    <button id="install-btn" class="install-btn" hidden>앱 설치</button>

    <div id="setup-screen" class="screen active">
        <label for="round-select">단어공부 회차를 선택하세요</label>
        <select id="round-select">
            <option value="">단어 데이터를 불러오는 중...</option>
        </select>
        <button id="start-btn" disabled>테스트 시작</button>
    </div>


    <div id="quiz-screen" class="screen">
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="progress-text" class="progress-text">0 / 10</div>

        <div class="card">
            <div id="meaning-display" class="meaning">뜻 불러오는 중...</div>
        </div>

        <input type="text" id="answer-input" placeholder="영어 단어를 입력하고 Enter" autocomplete="off" autofocus>
        <button id="submit-btn">확인 (Enter)</button>
    </div>

    <div id="result-screen" class="screen">
        <h2>테스트 완료! 🎉</h2>
        <div class="result-box">
            <p class="result-score" id="result-score"></p>
            <div id="wrong-container" class="wrong-list"></div>
        </div>
        <button id="restart-btn">다시 하기</button>
    </div>
</div>

<script>
    let currentQuizWords = [];
    let currentIndex = 0;
    let wrongAnswers = [];
    const WORDS_PER_ROUND = 10;

    // DOM 요소
    const setupScreen = document.getElementById('setup-screen');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const roundSelect = document.getElementById('round-select');
    const startBtn = document.getElementById('start-btn');
    
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const meaningDisplay = document.getElementById('meaning-display');
    const answerInput = document.getElementById('answer-input');
    const submitBtn = document.getElementById('submit-btn');
    
    const resultScore = document.getElementById('result-score');
    const wrongContainer = document.getElementById('wrong-container');
    const restartBtn = document.getElementById('restart-btn');
    const installBtn = document.getElementById('install-btn');

    let currentMode = 'word-study';
    let allWords = [];

    // CSV 파일 로드 함수
    async function loadCSV(fileName) {
        try {
            const csvUrl = new URL(fileName, window.location.href);
            csvUrl.searchParams.set('v', Date.now());
            const response = await fetch(csvUrl, { cache: 'no-store' });
            if (!response.ok) throw new Error(`${fileName} 파일을 찾을 수 없습니다.`);
            
            const data = await response.text();
            return parseCSV(data);
        } catch (error) {
            alert(`${fileName} 파일을 불러오는 데 실패했습니다.\n${error.message}`);
            return [];
        }
    }

    // 간단한 CSV 파싱 (1행: 헤더 제외)
    function parseCSV(text) {
        const lines = text.trim().split('\n');
        const words = [];

        // 첫 번째 행(헤더)을 건너뛰고 1번 인덱스부터 순회
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            
            const parts = line.match(/(?:^|,)("(?:[^"]|"")*"|[^,]*)/g)
                .map(part => part.replace(/^,/, '').replace(/^"|"$/g, '').replace(/""/g, '"').trim());
            if (parts.length >= 4) {
                words.push({
                    session: parts[0],
                    no: parseInt(parts[1], 10),
                    word: parts[2],
                    meaning: parts.slice(3).join(',')
                });
            }
        }
        return words;
    }

    // 회차 셀렉트 박스 동적 생성
    function initRoundSelect() {
        const sessions = [...new Set(allWords.map(item => item.session).filter(Boolean))];

        roundSelect.innerHTML = '';
        if (sessions.length === 0) {
            roundSelect.innerHTML = '<option value="">단어가 없습니다</option>';
            return;
        }

        sessions.sort((first, second) => Number(first) - Number(second));
        sessions.forEach(session => {
            const sessionWords = allWords.filter(item => item.session === session);
            const option = document.createElement('option');
            option.value = session;
            option.textContent = `${session}회차 (${sessionWords.length}개)`;
            roundSelect.appendChild(option);
        });

        startBtn.disabled = false;
    }

    // 배열 무작위 셔플 (피셔-예이츠)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // 테스트 시작
    function startQuiz() {
        const selectedSession = roundSelect.value;

        // 선택한 session에 해당하는 단어 추출
        const targetWords = allWords.filter(item => item.session === selectedSession);

        if (targetWords.length === 0) {
            alert('해당 회차에 단어가 없습니다.');
            return;
        }

        currentQuizWords = shuffle([...targetWords]);
        currentIndex = 0;
        wrongAnswers = [];

        // 화면 전환
        setupScreen.classList.remove('active');
        quizScreen.classList.add('active');

        showQuestion();
    }

    // 문제 표시
    function showQuestion() {
        if (currentIndex >= currentQuizWords.length) {
            finishQuiz();
            return;
        }

        const currentWord = currentQuizWords[currentIndex];
        meaningDisplay.textContent = currentWord.meaning;
        answerInput.value = '';
        answerInput.focus();

        // 진행률 업데이트
        const progressPercent = ((currentIndex) / currentQuizWords.length) * 100;
        progressBar.style.width = `${progressPercent}%`;
        progressText.textContent = `${currentIndex + 1} / ${currentQuizWords.length}`;
    }

    // 정답 제출 처리
    function checkAnswer() {
        const userAnswer = answerInput.value.trim().toLowerCase();
        const currentWord = currentQuizWords[currentIndex];
        const correctAnswer = currentWord.word.trim().toLowerCase();

        if (userAnswer === '') return;

        // 오답 처리
        if (userAnswer !== correctAnswer) {
            wrongAnswers.push({
                meaning: currentWord.meaning,
                correct: currentWord.word,
                user: answerInput.value.trim()
            });
        }

        currentIndex++;
        showQuestion();
    }

    // 테스트 종료
    function finishQuiz() {
        quizScreen.classList.remove('active');
        resultScreen.classList.add('active');

        const total = currentQuizWords.length;
        const wrongCount = wrongAnswers.length;
        const correctCount = total - wrongCount;

        resultScore.innerHTML = `총 ${total}문제 중 <strong>${correctCount}개</strong> 맞춤<br>
                                <span style="color: #e74c3c;">(틀린 개수: ${wrongCount}개)</span>`;

        wrongContainer.innerHTML = '';
        if (wrongCount > 0) {
            const title = document.createElement('h4');
            title.textContent = "❌ 틀린 단어 목록";
            wrongContainer.appendChild(title);

            wrongAnswers.forEach(item => {
                const div = document.createElement('div');
                div.className = 'wrong-item';
                const meaning = document.createElement('strong');
                const correct = document.createTextNode(` : ${item.correct} `);
                const user = document.createElement('span');
                meaning.textContent = item.meaning;
                user.style.color = '#999';
                user.textContent = `(내가 쓴 답: ${item.user || '미입력'})`;
                div.append(meaning, correct, user);
                wrongContainer.appendChild(div);
            });
        } else {
            wrongContainer.innerHTML = '<p style="color: #4CAF50;">🎉 모두 맞췄습니다!</p>';
        }
    }

    // 이벤트 리스너 연결
    let deferredInstallPrompt;

    window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredInstallPrompt = event;
        installBtn.hidden = false;
    });

    installBtn.addEventListener('click', async () => {
        if (!deferredInstallPrompt) return;
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        installBtn.hidden = true;
    });

    window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        installBtn.hidden = true;
    });

    startBtn.addEventListener('click', startQuiz);
    submitBtn.addEventListener('click', checkAnswer);
    
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });

    restartBtn.addEventListener('click', () => {
        resultScreen.classList.remove('active');
        setupScreen.classList.add('active');
    });

    // 페이지 로드 시 CSV 파일 읽기
    window.addEventListener('DOMContentLoaded', async () => {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js').catch((error) => {
                console.error('서비스 워커 등록 실패:', error);
            });
        }

        allWords = await loadCSV('words.csv');
        initRoundSelect();
    });
</script>

</body>
</html>
